# ==========================================
# Configuración del servidor
# ==========================================
server.port=8081

# ==========================================
# Configuración de la Base de Datos (MySQL)
# ==========================================
# Conexión JDBC (crea la BD automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/eventos_catalogo_DB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Configuración de JPA / Hibernate
# ==========================================
# Mapeo del dialecto SQL para MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Actualiza el esquema de la BD automáticamente según tus entidades
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola las consultas SQL ejecutadas por Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Documentación OpenAPI / Swagger UI (Springdoc)
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html